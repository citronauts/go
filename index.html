<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dot Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      font-family: monospace;
      touch-action: none;
    }

    #arena {
      position: relative;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; }

    /* Controls: joystick zone left, action buttons right */
    #controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      max-width: 420px;
      height: 130px;
      margin-top: 12px;
      touch-action: none;
    }

    #joystick-zone {
      flex: 1;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    /* Always-visible idle joystick guide */
    #joystick-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: opacity 0.15s;
    }
    #joystick-guide.hidden { opacity: 0; }

    .joy-outer {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px dashed rgba(74, 144, 217, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: joyIdlePulse 2.2s ease-in-out infinite;
      box-shadow: 0 0 14px rgba(74, 144, 217, 0.2), inset 0 0 14px rgba(74, 144, 217, 0.07);
    }
    .joy-inner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(74, 144, 217, 0.3);
      border: 2px solid rgba(74, 144, 217, 0.8);
      box-shadow: 0 0 10px rgba(74, 144, 217, 0.5);
    }
    .joy-label {
      font-size: 11px;
      color: rgba(74, 144, 217, 0.75);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @keyframes joyIdlePulse {
      0%, 100% { border-color: rgba(74, 144, 217, 0.5); box-shadow: 0 0 10px rgba(74, 144, 217, 0.15), inset 0 0 10px rgba(74, 144, 217, 0.05); }
      50% { border-color: rgba(74, 144, 217, 0.9); box-shadow: 0 0 22px rgba(74, 144, 217, 0.35), inset 0 0 14px rgba(74, 144, 217, 0.12); }
    }

    #joystick-base {
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(74, 144, 217, 0.18);
      border: 2px solid rgba(74, 144, 217, 0.65);
      box-shadow: 0 0 16px rgba(74, 144, 217, 0.4);
      display: none;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #joystick-thumb {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(74, 144, 217, 0.75);
      border: 2px solid #4a90d9;
      box-shadow: 0 0 12px rgba(74, 144, 217, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #action-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px 0 8px;
    }

    .action-btn {
      position: relative;
      overflow: hidden;
      width: 72px;
      height: 58px;
      background: rgba(233, 69, 96, 0.12);
      color: #e94560;
      border: 2px solid #e94560;
      border-radius: 14px;
      font-family: monospace;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      touch-action: none;
      box-shadow: 0 4px 0 rgba(233, 69, 96, 0.35), 0 0 14px rgba(233, 69, 96, 0.18);
      transition: transform 0.07s, box-shadow 0.07s, background 0.07s;
    }
    .btn-letter {
      font-size: 22px;
      font-weight: bold;
      line-height: 1;
    }
    .btn-sub {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .action-btn.pressed {
      background: #e94560;
      color: #fff;
      transform: scale(0.91) translateY(3px);
      box-shadow: 0 0 0 rgba(233, 69, 96, 0), 0 0 22px rgba(233, 69, 96, 0.7);
    }

    /* Ripple on press */
    .btn-ripple {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 72%);
      animation: rippleAnim 0.45s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      0%   { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    #hint {
      margin-top: 10px;
      color: #4a90d9;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div id="arena">
  <canvas id="game"></canvas>
</div>

<div id="controls">
  <div id="joystick-zone">
    <div id="joystick-guide">
      <div class="joy-outer"><div class="joy-inner"></div></div>
      <div class="joy-label">move</div>
    </div>
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>
  <div id="action-btns">
    <button class="action-btn" id="btn-b">
      <span class="btn-letter">B</span>
      <span class="btn-sub">Build</span>
    </button>
    <button class="action-btn" id="btn-l">
      <span class="btn-letter">L</span>
      <span class="btn-sub">Launch</span>
    </button>
  </div>
</div>

<div id="hint">[ B ] = Build &nbsp;|&nbsp; [ L ] = Launch</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Size the arena to fit available space
  function resize() {
    const margin = 32;
    const controlsH = 130 + 10 + 20 + 16;
    const maxW = window.innerWidth - margin * 2;
    const maxH = window.innerHeight - controlsH - margin;
    const size = Math.min(maxW, maxH, 420);
    canvas.width = size;
    canvas.height = size;
    dot.x = Math.min(Math.max(dot.x, dot.r), size - dot.r);
    dot.y = Math.min(Math.max(dot.y, dot.r), size - dot.r);
  }

  const dot = { x: 0, y: 0, r: 14, speed: 3 };
  const keys = { w: false, a: false, s: false, d: false };
  const buildings = [];
  let buildState = null;
  const BUILD_TIME = 1500;

  const missiles = [];
  const explosions = [];
  const LAUNCH_TIME = 1000;
  const EXPLOSION_TIME = 600;
  let score = 0;

  resize();
  dot.x = canvas.width / 2;
  dot.y = canvas.height / 2;
  window.addEventListener('resize', resize);

  // ── Keyboard input (desktop) ──────────────────────────────────────
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k in keys) { keys[k] = true; e.preventDefault(); }
    if (k === 'b' && !buildState) {
      buildState = { x: dot.x, y: dot.y, startTime: performance.now() };
      e.preventDefault();
    }
    if (k === 'l' && buildings.length > 0) {
      launchAtFurthest();
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k in keys) keys[k] = false;
  });

  // ── Virtual joystick ──────────────────────────────────────────────
  const MAX_JOY_R = 44;
  const joystick = { active: false, pointerId: null, originX: 0, originY: 0, dx: 0, dy: 0 };
  const joyBase  = document.getElementById('joystick-base');
  const joyThumb = document.getElementById('joystick-thumb');
  const joyZone  = document.getElementById('joystick-zone');
  const joyGuide = document.getElementById('joystick-guide');

  function updateJoyUI() {
    if (joystick.active) {
      joyGuide.classList.add('hidden');
      joyBase.style.display = 'block';
      joyBase.style.left = joystick.originX + 'px';
      joyBase.style.top  = joystick.originY + 'px';
      joyThumb.style.transform =
        `translate(calc(-50% + ${joystick.dx * MAX_JOY_R}px), calc(-50% + ${joystick.dy * MAX_JOY_R}px))`;
    } else {
      joyGuide.classList.remove('hidden');
      joyBase.style.display = 'none';
      joyThumb.style.transform = 'translate(-50%, -50%)';
    }
  }

  joyZone.addEventListener('pointerdown', e => {
    if (joystick.active) return; // only one finger drives the stick
    joyZone.setPointerCapture(e.pointerId);
    const rect = joyZone.getBoundingClientRect();
    joystick.active = true;
    joystick.pointerId = e.pointerId;
    joystick.originX = e.clientX - rect.left;
    joystick.originY = e.clientY - rect.top;
    joystick.dx = 0;
    joystick.dy = 0;
    updateJoyUI();
  });

  joyZone.addEventListener('pointermove', e => {
    if (e.pointerId !== joystick.pointerId) return;
    const rect = joyZone.getBoundingClientRect();
    const rawDx = (e.clientX - rect.left) - joystick.originX;
    const rawDy = (e.clientY - rect.top)  - joystick.originY;
    const dist  = Math.hypot(rawDx, rawDy) || 1;
    const clamped = Math.min(dist, MAX_JOY_R);
    joystick.dx = (rawDx / dist) * (clamped / MAX_JOY_R);
    joystick.dy = (rawDy / dist) * (clamped / MAX_JOY_R);
    updateJoyUI();
  });

  function releaseJoy(e) {
    if (e.pointerId !== joystick.pointerId) return;
    joystick.active = false;
    joystick.pointerId = null;
    joystick.dx = 0;
    joystick.dy = 0;
    updateJoyUI();
  }
  joyZone.addEventListener('pointerup',     releaseJoy);
  joyZone.addEventListener('pointercancel', releaseJoy);

  // ── Action buttons (B and L) ──────────────────────────────────────
  function setupActionBtn(id, action) {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      btn.classList.add('pressed');
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 450);
      action();
    });
    btn.addEventListener('pointerup',     () => btn.classList.remove('pressed'));
    btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
  }

  setupActionBtn('btn-b', () => {
    if (!buildState) buildState = { x: dot.x, y: dot.y, startTime: performance.now() };
  });
  setupActionBtn('btn-l', () => {
    if (buildings.length > 0) launchAtFurthest();
  });

  // ── Shared launch logic ───────────────────────────────────────────
  function launchAtFurthest() {
    let target = null, maxDist = -1;
    for (const b of buildings) {
      const d = Math.hypot(b.x - dot.x, b.y - dot.y);
      if (d > maxDist) { maxDist = d; target = b; }
    }
    if (target) missiles.push({ startX: dot.x, startY: dot.y, target, startTime: performance.now() });
  }

  // ── Trail ─────────────────────────────────────────────────────────
  const trail = [];
  const MAX_TRAIL = 18;

  // ── Update ────────────────────────────────────────────────────────
  function update() {
    if (buildState) {
      if (performance.now() - buildState.startTime >= BUILD_TIME) {
        buildings.push({ x: buildState.x, y: buildState.y });
        buildState = null;
      }
      return;
    }

    // Combine joystick + keyboard
    let dx = joystick.dx;
    let dy = joystick.dy;
    if (keys.w) dy -= 1;
    if (keys.s) dy += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;

    const len = Math.hypot(dx, dy);
    let moved = false;
    if (len > 0.05) {
      const scale = Math.min(len, 1) / len;
      dot.x += dx * scale * dot.speed;
      dot.y += dy * scale * dot.speed;
      moved = true;
    }

    dot.x = Math.min(Math.max(dot.x, dot.r), canvas.width  - dot.r);
    dot.y = Math.min(Math.max(dot.y, dot.r), canvas.height - dot.r);

    if (moved) trail.push({ x: dot.x, y: dot.y });
    if (trail.length > MAX_TRAIL) trail.shift();

    // Resolve missiles
    const now = performance.now();
    for (let i = missiles.length - 1; i >= 0; i--) {
      if (now - missiles[i].startTime >= LAUNCH_TIME) {
        const m = missiles.splice(i, 1)[0];
        const idx = buildings.indexOf(m.target);
        if (idx !== -1) buildings.splice(idx, 1);
        explosions.push({ x: m.target.x, y: m.target.y, startTime: now });
        score += 100;
      }
    }
    for (let i = explosions.length - 1; i >= 0; i--) {
      if (now - explosions[i].startTime >= EXPLOSION_TIME) explosions.splice(i, 1);
    }
  }

  // ── Drawing helpers ───────────────────────────────────────────────
  function drawBuilding(x, y, alpha) {
    const bw = 34, bh = 46;
    const bx = x - bw / 2, by = y - bh / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#1e3a5f';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#4a90d9';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.strokeStyle = '#2a4a6f';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + 15); ctx.lineTo(bx + bw, by + 15);
    ctx.moveTo(bx, by + 30); ctx.lineTo(bx + bw, by + 30);
    ctx.stroke();
    ctx.fillStyle = '#7ec8e3';
    for (const [wx, wy] of [[bx+5,by+4],[bx+bw-12,by+4],[bx+5,by+19],[bx+bw-12,by+19]])
      ctx.fillRect(wx, wy, 7, 7);
    ctx.fillStyle = '#0f3460';
    ctx.fillRect(bx + bw/2 - 4, by + bh - 12, 8, 12);
    ctx.strokeStyle = '#4a90d9';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + bw/2 - 4, by + bh - 12, 8, 12);
    ctx.globalAlpha = 1;
  }

  function drawMissile(m) {
    const t = (performance.now() - m.startTime) / LAUNCH_TIME;
    const x = m.startX + (m.target.x - m.startX) * t;
    const arcH = Math.min(120, Math.hypot(m.target.x - m.startX, m.target.y - m.startY) * 0.5);
    const y = m.startY + (m.target.y - m.startY) * t - arcH * Math.sin(Math.PI * t);
    for (let i = 1; i <= 6; i++) {
      const tp = Math.max(0, t - i * 0.03);
      const tx = m.startX + (m.target.x - m.startX) * tp;
      const ty = m.startY + (m.target.y - m.startY) * tp - arcH * Math.sin(Math.PI * tp);
      ctx.globalAlpha = (1 - i / 7) * 0.5;
      ctx.beginPath();
      ctx.arc(tx, ty, 4 - i * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#ff9500';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, 10);
    grd.addColorStop(0, 'rgba(255,200,50,0.9)');
    grd.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }

  function drawExplosion(e) {
    const t = (performance.now() - e.startTime) / EXPLOSION_TIME;
    const alpha = 1 - t;
    ctx.globalAlpha = alpha * 0.8;
    ctx.beginPath(); ctx.arc(e.x, e.y, 50 * t, 0, Math.PI * 2);
    ctx.strokeStyle = '#ff6b35'; ctx.lineWidth = 3; ctx.stroke();
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, 28 * t, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700'; ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+100', e.x, e.y - 30 * t - 10);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // ── Draw ──────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Score
    ctx.fillStyle = '#4a90d9';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`score: ${score}`, canvas.width - 8, 20);
    ctx.textAlign = 'left';

    for (const b of buildings) drawBuilding(b.x, b.y, 1);

    if (buildState) {
      const progress = (performance.now() - buildState.startTime) / BUILD_TIME;
      drawBuilding(buildState.x, buildState.y, 0.3 + progress * 0.7);
      const barW = 40, barH = 5;
      const bx = buildState.x - barW / 2, by = buildState.y - 34;
      ctx.fillStyle = '#0f3460'; ctx.fillRect(bx, by, barW, barH);
      ctx.fillStyle = '#e94560'; ctx.fillRect(bx, by, barW * progress, barH);
      ctx.strokeStyle = '#4a90d9'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, barW, barH);
    }

    for (const m of missiles)   drawMissile(m);
    for (const e of explosions) drawExplosion(e);

    // Trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const alpha = (i + 1) / trail.length * 0.5;
      const r = dot.r * ((i + 1) / trail.length);
      ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(233, 69, 96, ${alpha})`; ctx.fill();
    }

    // Glow
    const grd = ctx.createRadialGradient(dot.x, dot.y, 0, dot.x, dot.y, dot.r * 2.5);
    grd.addColorStop(0, 'rgba(233, 69, 96, 0.6)');
    grd.addColorStop(1, 'rgba(233, 69, 96, 0)');
    ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();

    // Dot
    ctx.beginPath(); ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
    ctx.fillStyle = '#e94560'; ctx.fill();
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
</html>
