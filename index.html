<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dot Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
      font-family: monospace;
      touch-action: none;
    }

    #arena {
      position: relative;
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; }

    #controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
      margin-top: 16px;
    }

    .key-btn {
      width: 60px;
      height: 60px;
      background: #0f3460;
      color: #e94560;
      border: 2px solid #e94560;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
    }

    .key-btn:active, .key-btn.pressed {
      background: #e94560;
      color: #fff;
    }

    /* W is in column 2, row 1; A col 1 row 2; S col 2 row 2; D col 3 row 2 */
    #btn-w { grid-column: 2; grid-row: 1; }
    #btn-a { grid-column: 1; grid-row: 2; }
    #btn-s { grid-column: 2; grid-row: 2; }
    #btn-d { grid-column: 3; grid-row: 2; }

    #hint {
      margin-top: 12px;
      color: #4a90d9;
      font-size: 13px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div id="arena">
  <canvas id="game"></canvas>
</div>

<div id="controls">
  <button class="key-btn" id="btn-w">W</button>
  <button class="key-btn" id="btn-a">A</button>
  <button class="key-btn" id="btn-s">S</button>
  <button class="key-btn" id="btn-d">D</button>
</div>

<div id="hint">[ B ] = Build</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Size the arena to fit available space
  function resize() {
    const margin = 32;
    const controlsH = 60 * 2 + 8 + 16 + 16; // grid + gap + marginTop + body padding
    const maxW = window.innerWidth - margin * 2;
    const maxH = window.innerHeight - controlsH - margin;
    const size = Math.min(maxW, maxH, 420);
    canvas.width = size;
    canvas.height = size;
    // Keep dot inside after resize
    dot.x = Math.min(Math.max(dot.x, dot.r), size - dot.r);
    dot.y = Math.min(Math.max(dot.y, dot.r), size - dot.r);
  }

  const dot = { x: 0, y: 0, r: 14, speed: 3 };
  const keys = { w: false, a: false, s: false, d: false };
  const buildings = [];
  let buildState = null; // { x, y, startTime }
  const BUILD_TIME = 1500;

  resize();
  dot.x = canvas.width / 2;
  dot.y = canvas.height / 2;
  window.addEventListener('resize', resize);

  // Keyboard input
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k in keys) { keys[k] = true; e.preventDefault(); }
    if (k === 'b' && !buildState) {
      buildState = { x: dot.x, y: dot.y, startTime: performance.now() };
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k in keys) keys[k] = false;
  });

  // On-screen button input (touch + mouse)
  const btnMap = { 'btn-w': 'w', 'btn-a': 'a', 'btn-s': 's', 'btn-d': 'd' };
  for (const [id, key] of Object.entries(btnMap)) {
    const btn = document.getElementById(id);
    const press = () => { keys[key] = true; btn.classList.add('pressed'); };
    const release = () => { keys[key] = false; btn.classList.remove('pressed'); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  }

  // Trail
  const trail = [];
  const MAX_TRAIL = 18;

  function update() {
    if (buildState) {
      const elapsed = performance.now() - buildState.startTime;
      if (elapsed >= BUILD_TIME) {
        buildings.push({ x: buildState.x, y: buildState.y });
        buildState = null;
      }
      return; // frozen while building
    }

    let moved = false;
    if (keys.w) { dot.y -= dot.speed; moved = true; }
    if (keys.s) { dot.y += dot.speed; moved = true; }
    if (keys.a) { dot.x -= dot.speed; moved = true; }
    if (keys.d) { dot.x += dot.speed; moved = true; }

    dot.x = Math.min(Math.max(dot.x, dot.r), canvas.width - dot.r);
    dot.y = Math.min(Math.max(dot.y, dot.r), canvas.height - dot.r);

    if (moved) trail.push({ x: dot.x, y: dot.y });
    if (trail.length > MAX_TRAIL) trail.shift();
  }

  function drawBuilding(x, y, alpha) {
    const bw = 34, bh = 46;
    const bx = x - bw / 2;
    const by = y - bh / 2;
    ctx.globalAlpha = alpha;

    // Body
    ctx.fillStyle = '#1e3a5f';
    ctx.fillRect(bx, by, bw, bh);

    // Outline
    ctx.strokeStyle = '#4a90d9';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    // Horizontal floor lines
    ctx.strokeStyle = '#2a4a6f';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx, by + 15); ctx.lineTo(bx + bw, by + 15);
    ctx.moveTo(bx, by + 30); ctx.lineTo(bx + bw, by + 30);
    ctx.stroke();

    // Windows (2 columns x 2 rows)
    ctx.fillStyle = '#7ec8e3';
    const wins = [
      [bx + 5, by + 4], [bx + bw - 12, by + 4],
      [bx + 5, by + 19], [bx + bw - 12, by + 19],
    ];
    for (const [wx, wy] of wins) ctx.fillRect(wx, wy, 7, 7);

    // Door
    ctx.fillStyle = '#0f3460';
    ctx.fillRect(bx + bw / 2 - 4, by + bh - 12, 8, 12);
    ctx.strokeStyle = '#4a90d9';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + bw / 2 - 4, by + bh - 12, 8, 12);

    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Completed buildings
    for (const b of buildings) drawBuilding(b.x, b.y, 1);

    // Building in progress
    if (buildState) {
      const progress = (performance.now() - buildState.startTime) / BUILD_TIME;

      // Ghost building that fades in
      drawBuilding(buildState.x, buildState.y, 0.3 + progress * 0.7);

      // Progress bar above building
      const barW = 40, barH = 5;
      const bx = buildState.x - barW / 2;
      const by = buildState.y - 34;
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(bx, by, barW, barH);
      ctx.fillStyle = '#e94560';
      ctx.fillRect(bx, by, barW * progress, barH);
      ctx.strokeStyle = '#4a90d9';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, barW, barH);
    }

    // Trail
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const alpha = (i + 1) / trail.length * 0.5;
      const r = dot.r * ((i + 1) / trail.length);
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(233, 69, 96, ${alpha})`;
      ctx.fill();
    }

    // Glow
    const grd = ctx.createRadialGradient(dot.x, dot.y, 0, dot.x, dot.y, dot.r * 2.5);
    grd.addColorStop(0, 'rgba(233, 69, 96, 0.6)');
    grd.addColorStop(1, 'rgba(233, 69, 96, 0)');
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // Dot
    ctx.beginPath();
    ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
    ctx.fillStyle = '#e94560';
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
